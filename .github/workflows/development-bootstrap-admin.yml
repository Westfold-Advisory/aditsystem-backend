name: Development bootstrap admin

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Change ticket ID (required for audit)
        required: true
        type: string
      confirmation:
        description: Type BOOTSTRAP_DEVELOPMENT_ADMIN to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject invalid confirmation
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
          CHANGE_ID: ${{ github.event.inputs.change_id }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "BOOTSTRAP_DEVELOPMENT_ADMIN" ]]; then
            echo "Bootstrap rejected: confirmation must be BOOTSTRAP_DEVELOPMENT_ADMIN." >&2
            exit 1
          fi
          if [[ -z "${CHANGE_ID// }" ]]; then
            echo "Bootstrap rejected: change_id is required." >&2
            exit 1
          fi

  bootstrap:
    needs: validate
    secrets: inherit
    uses: ./.github/workflows/reusable-development-ssm.yml
    with:
      script_path: scripts/bootstrap-development-ssm.sh
      ssm_comment: Bootstrap development admin ${{ github.event.inputs.change_id }}
      preamble_shell: >-
        export BOOTSTRAP_CHANGE_ID=${{ github.event.inputs.change_id }}
        BOOTSTRAP_CONFIRMATION=BOOTSTRAP_DEVELOPMENT_ADMIN
