name: Development seed team admins

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Change ticket ID (required for audit)
        required: true
        type: string
      confirmation:
        description: Type SEED_DEVELOPMENT_TEAM_ADMINS to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  seed_team_admins:
    name: Seed team admins on development EC2
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject invalid confirmation
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
          CHANGE_ID: ${{ github.event.inputs.change_id }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "SEED_DEVELOPMENT_TEAM_ADMINS" ]]; then
            echo "Team admin seed rejected: confirmation must be SEED_DEVELOPMENT_TEAM_ADMINS." >&2
            exit 1
          fi
          if [[ -z "${CHANGE_ID// }" ]]; then
            echo "Team admin seed rejected: change_id is required." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/seed-team-admins-development-ssm.sh
            scripts/seed-team-admins-development-ec2.sh
          sparse-checkout-cone-mode: false
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run team admin seed on EC2 via SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          CHANGE_ID: ${{ github.event.inputs.change_id }}
        run: |
          set -euo pipefail
          if [[ -z "${INSTANCE_ID:-}" ]]; then
            echo "Team admin seed rejected: AWS_EC2_INSTANCE_ID is not configured." >&2
            exit 1
          fi
          wrapper_b64="$(base64 -w0 < scripts/seed-team-admins-development-ec2.sh)"
          payload="$(jq -n \
            --arg change "$CHANGE_ID" \
            --arg wrapper_b64 "$wrapper_b64" \
            --rawfile script scripts/seed-team-admins-development-ssm.sh \
            '{commands: [
              ("install -d -m 0755 /opt/aditsystem"
                + " && echo " + ($wrapper_b64 | @sh) + " | base64 -d > /opt/aditsystem/seed-team-admins-development-ec2.sh"
                + " && chmod 755 /opt/aditsystem/seed-team-admins-development-ec2.sh"),
              ("export TEAM_ADMINS_CHANGE_ID=" + ($change | @sh)
                + " TEAM_ADMINS_CONFIRMATION=SEED_DEVELOPMENT_TEAM_ADMINS"
                + " BOOTSTRAP_PASSWORD_SECRET_ID=aditsystem-dev/bootstrap-admin"
                + " TEAM_ADMIN_EMAILS_SECRET_ID=aditsystem-dev/team-admin-emails"),
              $script
            ]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Seed team admins ${CHANGE_ID}" \
            --parameters "$payload" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --output json)"
          echo "=== SSM STATUS ==="
          echo "$invocation" | jq -r '.Status'
          echo "=== SSM STDOUT ==="
          echo "$invocation" | jq -r '.StandardOutputContent'
          echo "=== SSM STDERR ==="
          echo "$invocation" | jq -r '.StandardErrorContent'
          echo "$invocation" | jq -r '.Status' | grep -qx Success
