name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      # Existing migrations and domain modules have legacy formatting findings.
      # Keep CI focused on correctness/security rules until that debt is addressed.
      - run: ruff check --ignore E501,S104,S105,S106,I001,F401,ASYNC250 .
      - name: Create ephemeral JWT fixtures for token tests
        run: |
          mkdir -p tests/fixtures
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out tests/fixtures/jwt-private.pem
          openssl rsa -pubout -in tests/fixtures/jwt-private.pem -out tests/fixtures/jwt-public.pem
      - run: pytest

  container:
    name: Build and scan image
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux x86_64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: aditsystem-backend:ci
      - name: Scan image for critical and high vulnerabilities
        # v0.36.0 pinned to its immutable commit.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: aditsystem-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  publish:
    name: Publish immutable image to ECR
    needs: [test, container]
    # Deployment configuration is managed outside this repository. Do not run
    # an incomplete OIDC deployment while Terraform/environment variables have
    # not yet provisioned the development target.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.AWS_REGION != '' && vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_ECR_REPOSITORY != ''
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials with GitHub OIDC
        # v6.3.0 pinned to its immutable commit; uses a supported Node runtime.
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
        run: echo "uri=$REGISTRY/$REPOSITORY:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and push linux/amd64 image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          SHA_TAG: sha-${{ github.sha }}
          VERSION: 0.1.0
        run: |
          test -n "$REPOSITORY"
          docker buildx build --platform linux/amd64 --push \
            --tag "$REGISTRY/$REPOSITORY:$SHA_TAG" \
            --tag "$REGISTRY/$REPOSITORY:main-${GITHUB_SHA::12}" \
            --tag "$REGISTRY/$REPOSITORY:v$VERSION-${GITHUB_SHA::12}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .

  deploy:
    name: Deploy API to EC2 via SSM
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      vars.AWS_EC2_INSTANCE_ID != '' && vars.AWS_RUNTIME_SECRET_ARN != '' &&
      vars.AWS_DB_SECRET_ARN != ''
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy immutable image and verify health
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
          DB_SECRET_ARN: ${{ vars.AWS_DB_SECRET_ARN }}
          IMAGE_URI: ${{ needs.publish.outputs.image_uri }}
        run: |
          payload="$(jq -n \
            --arg region "$AWS_REGION" \
            --arg image "$IMAGE_URI" \
            --arg runtime_secret "$RUNTIME_SECRET_ARN" \
            --arg db_secret "$DB_SECRET_ARN" \
            --rawfile script scripts/deploy-ec2.sh \
            '{commands: [("export AWS_REGION=" + ($region | @sh) + " IMAGE_URI=" + ($image | @sh) + " RUNTIME_SECRET_ARN=" + ($runtime_secret | @sh) + " DB_SECRET_ARN=" + ($db_secret | @sh)), $script]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_URI" \
            --parameters "$payload" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text | grep -qx Success
