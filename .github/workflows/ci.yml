name: Backend CI

on:
  pull_request:
    branches: [main]
    # Only run on PRs that touch code, config, or pipeline definitions.
    # Pushes to main always run (no paths filter) so every merge is gated.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'alembic/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel an in-flight main deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Tie the cache key to the dependency manifest so the cache is
          # invalidated exactly when dependencies change, not on every run.
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip ".[dev]"
      # Existing migrations and domain modules have legacy formatting findings.
      # Keep CI focused on correctness/security rules until that debt is addressed.
      - run: ruff check --ignore E501,S104,S105,S106,I001,F401,ASYNC250 .
      - name: Create ephemeral JWT fixtures for token tests
        run: |
          mkdir -p tests/fixtures
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out tests/fixtures/jwt-private.pem
          openssl rsa -pubout -in tests/fixtures/jwt-private.pem -out tests/fixtures/jwt-public.pem
      - run: pytest -m "not integration"

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aditsystem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aditsystem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aditsystem
      APP_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip ".[dev]"
      - name: Create ephemeral JWT fixtures for integration app
        run: |
          mkdir -p keys tests/fixtures
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/jwt-private.pem
          openssl rsa -pubout -in keys/jwt-private.pem -out keys/jwt-public.pem
          cp keys/jwt-private.pem tests/fixtures/jwt-private.pem
          cp keys/jwt-public.pem tests/fixtures/jwt-public.pem
      - run: pytest -m integration

  container:
    name: Build and scan image
    runs-on: ubuntu-24.04
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux x86_64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: aditsystem-backend:ci
          # Write layers to the GHA cache so the publish job reuses them on
          # main pushes and subsequent PRs get warm dependency layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for critical and high vulnerabilities
        # v0.36.0 pinned to its immutable commit.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: aditsystem-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  publish:
    name: Publish immutable image to ECR
    needs: [test, container]
    # Deployment configuration is managed outside this repository. Do not run
    # an incomplete OIDC deployment while Terraform/environment variables have
    # not yet provisioned the development target.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.AWS_REGION != '' && vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_ECR_REPOSITORY != ''
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image_uri.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials with GitHub OIDC
        # v6.3.0 pinned to its immutable commit; uses a supported Node runtime.
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: image_uri
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
        run: echo "uri=$REGISTRY/$REPOSITORY:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:main-${{ steps.meta.outputs.short_sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:v0.1.0-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Pull layers warmed by the container job above; avoids a full rebuild
          # of the dependency-heavy image on every main push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable OCI provenance attestations: not consumed downstream and
          # some ECR configurations reject unknown manifest list entries.
          provenance: false
          sbom: false

  deploy:
    name: Deploy API to EC2 via SSM
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      vars.AWS_EC2_INSTANCE_ID != '' && vars.AWS_RUNTIME_SECRET_ARN != '' &&
      vars.AWS_DB_SECRET_ARN != '' && vars.AWS_DB_HOST != ''
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The deploy job only reads scripts/deploy-ec2.sh; a sparse checkout
          # avoids fetching the full history and all source files.
          sparse-checkout: scripts/deploy-ec2.sh
          sparse-checkout-cone-mode: false
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy immutable image and verify health
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
          DB_SECRET_ARN: ${{ vars.AWS_DB_SECRET_ARN }}
          DB_HOST: ${{ vars.AWS_DB_HOST }}
          DB_PORT: ${{ vars.AWS_DB_PORT }}
          IMAGE_URI: ${{ needs.publish.outputs.image_uri }}
        run: |
          payload="$(jq -n \
            --arg region "$AWS_REGION" \
            --arg image "$IMAGE_URI" \
            --arg runtime_secret "$RUNTIME_SECRET_ARN" \
            --arg db_secret "$DB_SECRET_ARN" \
            --arg db_host "$DB_HOST" \
            --arg db_port "${DB_PORT:-5432}" \
            --rawfile script scripts/deploy-ec2.sh \
            '{commands: [("export AWS_REGION=" + ($region | @sh) + " IMAGE_URI=" + ($image | @sh) + " RUNTIME_SECRET_ARN=" + ($runtime_secret | @sh) + " DB_SECRET_ARN=" + ($db_secret | @sh) + " DB_HOST=" + ($db_host | @sh) + " DB_PORT=" + ($db_port | @sh)), $script]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy backend ${GITHUB_SHA::7}" \
            --parameters "$payload" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --output json)"
          echo "=== SSM STATUS ==="
          echo "$invocation" | jq -r '.Status'
          echo "=== SSM STDOUT ==="
          echo "$invocation" | jq -r '.StandardOutputContent'
          echo "=== SSM STDERR ==="
          echo "$invocation" | jq -r '.StandardErrorContent'
          echo "$invocation" | jq -r '.Status' | grep -qx Success
