name: Development seed Faker hierarchy

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Change ticket ID (required for audit)
        required: true
        type: string
      confirmation:
        description: Type SEED_DEVELOPMENT_FAKER to confirm
        required: true
        type: string
      fresh_subtree:
        description: Replace existing faker.* subtrees before insert
        required: false
        type: boolean
        default: false
      cg:
        description: Number of COORDINADOR_GENERAL roots
        required: false
        type: string
        default: "2"
      coordinadores_por_cg:
        description: Coordinadores per CG
        required: false
        type: string
        default: "3"
      enlaces_por_coordinador:
        description: Enlaces per coordinador
        required: false
        type: string
        default: "5"
      amigos_por_enlace:
        description: Amigos per enlace
        required: false
        type: string
        default: "10"

permissions:
  contents: read

jobs:
  seed_faker:
    name: Seed Faker hierarchy on development EC2
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject invalid confirmation
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
          CHANGE_ID: ${{ github.event.inputs.change_id }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "SEED_DEVELOPMENT_FAKER" ]]; then
            echo "Faker seed rejected: confirmation must be SEED_DEVELOPMENT_FAKER." >&2
            exit 1
          fi
          if [[ -z "${CHANGE_ID// }" ]]; then
            echo "Faker seed rejected: change_id is required." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/seed-faker-development-ssm.sh
          sparse-checkout-cone-mode: false
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run Faker seed on EC2 via SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          MEDIA_BUCKET_NAME: ${{ vars.AWS_MEDIA_BUCKET_NAME }}
          CHANGE_ID: ${{ github.event.inputs.change_id }}
          FRESH: ${{ github.event.inputs.fresh_subtree }}
          CG: ${{ github.event.inputs.cg }}
          CO: ${{ github.event.inputs.coordinadores_por_cg }}
          EN: ${{ github.event.inputs.enlaces_por_coordinador }}
          AM: ${{ github.event.inputs.amigos_por_enlace }}
        run: |
          set -euo pipefail
          if [[ -z "${INSTANCE_ID:-}" ]]; then
            echo "Faker seed rejected: AWS_EC2_INSTANCE_ID is not configured." >&2
            exit 1
          fi
          if [[ -z "${MEDIA_BUCKET_NAME:-}" ]]; then
            echo "Faker seed rejected: AWS_MEDIA_BUCKET_NAME is not configured." >&2
            exit 1
          fi
          seed_args="--cg ${CG} --coordinadores-por-cg ${CO} --enlaces-por-coordinador ${EN} --amigos-por-enlace ${AM}"
          if [[ "$FRESH" == "true" ]]; then
            seed_args="--fresh-subtree ${seed_args}"
          fi
          payload="$(jq -n \
            --arg change "$CHANGE_ID" \
            --arg args "$seed_args" \
            --arg media_bucket "$MEDIA_BUCKET_NAME" \
            --rawfile script scripts/seed-faker-development-ssm.sh \
            '{commands: [
              ("export SEED_FAKER_CHANGE_ID=" + ($change | @sh)
                + " SEED_FAKER_CONFIRMATION=SEED_DEVELOPMENT_FAKER"
                + " SEED_FAKER_ARGS=" + ($args | @sh)
                + " MEDIA_BUCKET_NAME=" + ($media_bucket | @sh)
                + " BOOTSTRAP_PASSWORD_SECRET_ID=aditsystem-dev/bootstrap-admin"),
              $script
            ]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Manual Faker seed ${CHANGE_ID}" \
            --parameters "$payload" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --output json)"
          echo "=== SSM STATUS ==="
          echo "$invocation" | jq -r '.Status'
          echo "=== SSM STDOUT ==="
          echo "$invocation" | jq -r '.StandardOutputContent'
          echo "=== SSM STDERR ==="
          echo "$invocation" | jq -r '.StandardErrorContent'
          echo "$invocation" | jq -r '.Status' | grep -qx Success
