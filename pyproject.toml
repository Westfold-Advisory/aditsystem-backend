[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aditsystem-backend"
version = "0.1.0"
description = "Backend FastAPI para ADITSYSTEM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "boto3>=1.35.0,<2.0.0",
  "defusedxml>=0.7.0,<1.0.0",
  "bcrypt>=4.3.0,<5.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "geoalchemy2>=0.18.0,<1.0.0",
  "greenlet>=3.2.0,<4.0.0",
  "httpx>=0.28.0,<1.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "pyjwt[crypto]>=2.10.0,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "shapely>=2.1.0,<3.0.0",
  "sqlalchemy>=2.0.42,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "ruff>=0.12.0,<1.0.0",
]
[project.scripts]
aditsystem-api = "aditsystem_backend.main:run"
aditsystem-bootstrap-admin = "aditsystem_backend.cli.bootstrap_admin:main_cli"
aditsystem-reset-development = "aditsystem_backend.cli.reset_development:main_cli"
aditsystem-seed-development = "aditsystem_backend.cli.seed_development:main_cli"
aditsystem-seed-team-admins = "aditsystem_backend.cli.seed_team_admins:main_cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires Postgres/PostGIS (RUN_INTEGRATION_TESTS=1)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
